[package]
name = "kairo-devrun"
description = "M0 dev loop: runs jobs and the watch agent in the owner's Windows session."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
kairo-core = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",                  # HANDLE, HWND, RECT, errors
    "Win32_Graphics_Gdi",                # MonitorFromWindow, GetMonitorInfoW
    "Win32_Security",                    # GetTokenInformation; CreateMutexW and CreateJobObjectW need it
    "Win32_System_Diagnostics_ToolHelp", # CreateToolhelp32Snapshot, Thread32First/Next
    "Win32_System_JobObjects",           # one job object per job: stop the whole process tree
    "Win32_System_SystemInformation",    # GetTickCount
    "Win32_System_Threading",            # OpenProcess, QueryFullProcessImageNameW, mutexes, threads
    "Win32_UI_Input_KeyboardAndMouse",   # GetLastInputInfo
    "Win32_UI_WindowsAndMessaging",      # GetForegroundWindow, GetWindowRect, GetClassNameW
] }

[lints]
workspace = true
