[package]
name = "kairo-testbed"
description = "testbed.exe and kairo-tone.exe: pattern v1 and beeps on the QPC timeline, with logs as ground truth (M1, research 16 §4–5)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "testbed"
path = "src/bin/testbed.rs"

[dependencies]
kairo-core = { workspace = true }
kairo-display = { workspace = true }
kairo-window = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "kairo-tone"
path = "src/bin/kairo-tone.rs"

[target.'cfg(windows)'.dependencies]
wasapi = { workspace = true }
# The window, the device on the adapter, QPC and the foreground wait are kairo-window's.
windows = { workspace = true, features = [
    "Win32_Foundation",             # HWND, RECT, handles
    "Win32_Graphics_Direct3D",      # WARP, in the tests
    "Win32_Graphics_Direct3D11",    # textures, clears and copies
    "Win32_Graphics_Dxgi",          # the swap chain, its statistics, vblanks
    "Win32_Graphics_Dxgi_Common",   # formats, colour spaces
    "Win32_Security",               # CreateWaitableTimerExW's attributes
    "Win32_System_Threading",       # the timer and its wait
] }

[lints]
workspace = true
