[package]
name = "kairo-cli"
description = "Talks to Kairo's named pipes from an SSH session (M0: the hello probe)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
kairo-core = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",         # ERROR_PIPE_BUSY and friends
    "Win32_Storage_FileSystem", # SECURITY_IDENTIFICATION for the pipe client
] }

[lints]
workspace = true
